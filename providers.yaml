# IP Checker â€” provider registry (spec Â§5.1, Â§5.2, Â§5.3, Â§5.5)
#
# THIS FILE CONTAINS NO KEYS. API keys live in Windows Credential Manager
# (service "com.ipchecker.app", account = provider id). See spec Â§2.1 / Â§11.
#
# Field contract (Â§5.5):
#   id                  registry id, must equal the `pub const ID` in the adapter
#   category            geo | asn | fraud | abuse | threat_intel | blacklist | network | leak | speed | local_db
#   upstream            root data source â€” votes are de-duplicated by upstream+category (Â§6.2)
#   method              api | dns | bgp | local_db
#   requires_key        true => skipped with skip_reason=missing_key when no key is stored
#   weight_in_category  share of the category weight BEFORE health decay; â‰¤ 0.40 (Â§6.4)
#   timeout_ms          5000â€“8000 (Â§4.3)
#   rate_limit          requests/minute for the free tier; 0 = unknown/unlimited
#   enabled_by_default  run out of the box without any configuration
#   thresholds          Â§6.1 normalisation in the provider's OWN scale:
#                         raw < clean_below          â†’ Signal::Clean
#                         clean_below..bad_above     â†’ Signal::Suspicious
#                         raw > bad_above            â†’ Signal::Bad
#   zone                DNSBL only â€” queried as <reversed-ip>.<zone>
#   group               DNSBL only â€” spamhaus | commercial | community | specialist
#   listed_verdict      DNSBL only â€” bad | suspicious (Â§6.1 / Â§6.5)
#
# A group is ONE vote no matter how many zones it holds (Â§5.3).

